version: "3.9"

services:
  db:
    image: ankane/pgvector:latest   # Postgres + pgvector extension preinstalled
    environment:
      POSTGRES_USER: afaq
      POSTGRES_PASSWORD: afaq
      POSTGRES_DB: afaq
    ports:
      - "5432:5432"
    volumes:
      - afaq_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://afaq:afaq@db:5432/afaq
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  afaq_db_data:
