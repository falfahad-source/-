name: afaq

services:
  db:
    image: ankane/pgvector:latest   # Postgres + pgvector extension preinstalled
    environment:
      POSTGRES_USER: afaq
      POSTGRES_PASSWORD: afaq
      POSTGRES_DB: afaq
    ports:
      - "5432:5432"
    volumes:
      - afaq_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    # AFAQ_AI_* (AI platform) and AFAQ_REVIEWERS come from .env when it exists;
    # DATABASE_URL below wins over the .env one, which points at localhost.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://afaq:afaq@db:5432/afaq
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # keep the image's node_modules/.next instead of the host's (bind mount would hide them)
      - /app/node_modules
      - /app/.next

volumes:
  afaq_db_data:
